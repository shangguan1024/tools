<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layer 3D 可视化工具</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: Arial, sans-serif; }
        #toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: #2c3e50;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 10px;
            z-index: 100;
        }
        #toolbar button {
            padding: 8px 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #toolbar button:hover { background: #2980b9; }
        #info {
            color: #ecf0f1;
            margin-left: 20px;
            font-size: 14px;
        }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="btn-load">选择日志文件</button>
        <button id="btn-reset">重置视角</button>
        <span id="info">请选择日志文件...</span>
        <input type="file" id="file-input" accept=".txt" style="display: none;">
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        let scene, camera, renderer, controls;
        const layers = [];
        const items = [];

        function parseAndRender(text) {
            clearAll();
            
            const lines = text.split('\n');
            let layerIndex = 0;
            let currentLayer = null;
            
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                
                if (trimmed.startsWith('layer：')) {
                    const parts = trimmed.replace('layer：', '').split(/\s+/);
                    let id = '', x1, y1, x2, y2;
                    
                    for (let i = 0; i < parts.length; i++) {
                        if (parts[i] === 'id' && i + 1 < parts.length) {
                            id = parts[i + 1];
                        }
                        if (parts[i] === 'x' && i + 1 < parts.length) {
                            if (x1 === undefined) x1 = parseFloat(parts[i + 1]);
                            else if (x2 === undefined) x2 = parseFloat(parts[i + 1]);
                        }
                        if (parts[i] === 'y' && i + 1 < parts.length) {
                            if (y1 === undefined) y1 = parseFloat(parts[i + 1]);
                            else if (y2 === undefined) y2 = parseFloat(parts[i + 1]);
                        }
                    }
                    
                    if (id && x1 !== undefined && y1 !== undefined && x2 !== undefined && y2 !== undefined) {
                        currentLayer = createLayerBox(id, x1, y1, x2, y2, layerIndex);
                        layerIndex++;
                    }
                } else if (trimmed.startsWith('item:') && currentLayer) {
                    const parts = trimmed.split(/\s+/);
                    let name = '', x1, y1, x2, y2;
                    
                    for (let i = 0; i < parts.length; i++) {
                        if (parts[i] === 'name' && i + 1 < parts.length) {
                            name = parts[i + 1];
                        }
                        if (parts[i] === 'x' && i + 1 < parts.length) {
                            if (x1 === undefined) x1 = parseFloat(parts[i + 1]);
                            else if (x2 === undefined) x2 = parseFloat(parts[i + 1]);
                        }
                        if (parts[i] === 'y' && i + 1 < parts.length) {
                            if (y1 === undefined) y1 = parseFloat(parts[i + 1]);
                            else if (y2 === undefined) y2 = parseFloat(parts[i + 1]);
                        }
                    }
                    
                    if (name && x1 !== undefined && y1 !== undefined && x2 !== undefined && y2 !== undefined) {
                        createItemBox(name, x1, y1, x2, y2, currentLayer.z);
                    }
                }
            }
            
            document.getElementById('info').textContent = `已加载 ${layerIndex} 个layer`;
        }

        function loadLog() {
            document.getElementById('file-input').click();
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('info').textContent = '加载中...';
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                parseAndRender(text);
                document.getElementById('info').textContent = '日志加载成功: ' + file.name;
            };
            reader.onerror = function() {
                document.getElementById('info').textContent = '读取文件失败';
            };
            reader.readAsText(file);
        });

        function clearAll() {
            for (const layer of layers) {
                scene.remove(layer.box);
                scene.remove(layer.text);
                scene.remove(layer.edges);
            }
            layers.length = 0;
            
            for (const item of items) {
                scene.remove(item.box);
                scene.remove(item.text);
                scene.remove(item.edges);
            }
            items.length = 0;
        }

        function createLayerBox(id, x1, y1, x2, y2, z) {
            const width = Math.abs(x2 - x1);
            const height = Math.abs(y2 - y1);
            const depth = 0.3;
            
            const centerX = (x1 + x2) / 2;
            const centerY = (y1 + y2) / 2;
            const screenY = -centerY;
            
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x007AFF,
                transparent: true,
                opacity: 0.15
            });
            const box = new THREE.Mesh(geometry, material);
            box.position.set(centerX, screenY, z * 2);
            scene.add(box);
            
            const edgesGeometry = new THREE.EdgesGeometry(geometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ color: 0x007AFF, linewidth: 2 });
            const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
            edges.position.copy(box.position);
            scene.add(edges);
            
            let textMesh = null;
            if (window.textFont) {
                const textSize = Math.min(width, height) * 0.25;
                const textGeometry = new TextGeometry(id, {
                    font: window.textFont,
                    size: textSize,
                    height: 0.1
                });
                textGeometry.computeBoundingBox();
                const textMaterial = new THREE.MeshPhongMaterial({ color: 0x007AFF });
                textMesh = new THREE.Mesh(textGeometry, textMaterial);
                
                const bbox = textGeometry.boundingBox;
                const textWidth = bbox.max.x - bbox.min.x;
                const textHeight = bbox.max.y - bbox.min.y;
                
                textMesh.position.set(centerX - textWidth / 2, screenY - textHeight / 2, z * 2 + depth / 2 + 0.1);
                scene.add(textMesh);
            }
            
            const layerObj = { box, text: textMesh, id, z: z * 2, edges };
            layers.push(layerObj);
            return layerObj;
        }
        
        function createItemBox(name, x1, y1, x2, y2, z) {
            const width = Math.abs(x2 - x1);
            const height = Math.abs(y2 - y1);
            const depth = 0.1;
            
            const centerX = (x1 + x2) / 2;
            const centerY = (y1 + y2) / 2;
            const screenY = -centerY;
            
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0xAF52DE,
                transparent: true,
                opacity: 0.1
            });
            const box = new THREE.Mesh(geometry, material);
            box.position.set(centerX, screenY, z + depth);
            scene.add(box);
            
            const edgesGeometry = new THREE.EdgesGeometry(geometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ color: 0xAF52DE, linewidth: 2 });
            const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
            edges.position.copy(box.position);
            scene.add(edges);
            
            let textMesh = null;
            if (window.textFont) {
                const maxTextWidth = width * 0.8;
                const maxTextHeight = height * 0.5;
                let textSize = Math.min(width, height) * 0.2;
                
                const textGeometry = new TextGeometry(name, {
                    font: window.textFont,
                    size: textSize,
                    height: 0.05
                });
                textGeometry.computeBoundingBox();
                
                let bbox = textGeometry.boundingBox;
                let textWidth = bbox.max.x - bbox.min.x;
                let textHeight = bbox.max.y - bbox.min.y;
                
                while (textWidth > maxTextWidth && textSize > 0.5) {
                    textSize -= 0.1;
                    textGeometry.dispose();
                    const newGeometry = new TextGeometry(name, {
                        font: window.textFont,
                        size: textSize,
                        height: 0.05
                    });
                    newGeometry.computeBoundingBox();
                    bbox = newGeometry.boundingBox;
                    textWidth = bbox.max.x - bbox.min.x;
                    textHeight = bbox.max.y - bbox.min.y;
                }
                
                const textMaterial = new THREE.MeshPhongMaterial({ color: 0xAF52DE });
                textMesh = new THREE.Mesh(textGeometry, textMaterial);
                
                textMesh.position.set(centerX - textWidth / 2, screenY - textHeight / 2, z + depth + 0.05);
                scene.add(textMesh);
            }
            
            items.push({ box, text: textMesh, name, edges });
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(30, 30, 30);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 50, 50);
            scene.add(directionalLight);

            const fontLoader = new FontLoader();
            fontLoader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
                window.textFont = font;
            });

            const axesHelper = new THREE.AxesHelper(100);
            scene.add(axesHelper);
            
            const gridHelper = new THREE.GridHelper(200, 20);
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);

            document.getElementById('btn-load').addEventListener('click', loadLog);
            document.getElementById('btn-reset').addEventListener('click', resetCamera);

            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function resetCamera() {
            camera.position.set(30, 30, 30);
            camera.lookAt(0, 0, 0);
            controls.reset();
        }

        init();
    </script>
</body>
</html>
