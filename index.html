<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layer 3D 可视化工具</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: Arial, sans-serif; }
        #toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: #2c3e50;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 10px;
            z-index: 100;
        }
        #toolbar button {
            padding: 8px 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #toolbar button:hover { background: #2980b9; }
        #info {
            color: #ecf0f1;
            margin-left: 20px;
            font-size: 14px;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        #frame-control {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(44, 62, 80, 0.95);
            display: none;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            z-index: 100;
        }
        #frame-control.active { display: flex; }
        .frame-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
        }
        #frame-slider {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: #555;
            border-radius: 4px;
            outline: none;
        }
        #frame-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #3498db;
            border-radius: 50%;
            cursor: pointer;
        }
        #frame-info {
            color: #ecf0f1;
            font-size: 14px;
            min-width: 150px;
        }
        #frame-input {
            width: 50px;
            padding: 4px 8px;
            border: 1px solid #555;
            border-radius: 4px;
            background: #2c3e50;
            color: #ecf0f1;
            font-size: 14px;
            text-align: center;
        }
        #speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ecf0f1;
            font-size: 14px;
        }
        #speed-slider {
            width: 100px;
            height: 6px;
            -webkit-appearance: none;
            background: #555;
            border-radius: 3px;
        }
        #speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #3498db;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="btn-config">选择规则配置</button>
        <button id="btn-load">选择日志文件</button>
        <button id="btn-reset">重置视角</button>
        <span id="info">请先选择规则配置文件...</span>
        <input type="file" id="config-input" accept=".json" style="display: none;">
        <input type="file" id="file-input" accept=".txt" style="display: none;">
    </div>
    <div id="canvas-container"></div>
    <div id="frame-control">
        <button id="btn-prev" class="frame-btn">◀</button>
        <button id="btn-play" class="frame-btn">▶</button>
        <button id="btn-next" class="frame-btn">▶</button>
        <input type="range" id="frame-slider" min="1" max="1" value="1">
        <span id="frame-info">帧: 1 / 1</span>
        <input type="number" id="frame-input" min="1" value="1">
        <button id="btn-goto">跳转</button>
        <div id="speed-control">
            <span>速度:</span>
            <input type="range" id="speed-slider" min="100" max="2000" value="500">
            <span id="speed-value">500ms</span>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        let scene, camera, renderer, controls;
        const layers = [];
        const items = [];
        let parseRules = null;
        let parsedFrames = [];
        let currentFrameIndex = 0;
        let isPlaying = false;
        let playInterval = null;
        let playSpeed = 500;

        function parseLayerLine(line, prefix) {
            const trimmed = line.trim().replace(prefix, '');
            const parts = trimmed.split(/\s+/);
            const result = {};
            
            let xCount = 0;
            let yCount = 0;
            
            for (let i = 0; i < parts.length; i++) {
                const key = parts[i];
                const value = parts[i + 1];
                
                if (key === 'id' || key === 'name') {
                    result[key] = value;
                } else if (key === 'x') {
                    if (xCount === 0) result['x1'] = parseFloat(value);
                    else result['x2'] = parseFloat(value);
                    xCount++;
                } else if (key === 'y') {
                    if (yCount === 0) result['y1'] = parseFloat(value);
                    else result['y2'] = parseFloat(value);
                    yCount++;
                }
            }
            
            return result;
        }

        function parseLogToFrames(text) {
            if (!parseRules) return [];
            
            const lines = text.split('\n');
            const frames = [];
            let currentFrame = null;
            let currentLayer = null;
            
            const layerPrefix = parseRules.rules.layerPrefix;
            const itemPrefix = parseRules.rules.itemPrefix;
            const framePrefix = parseRules.rules.framePrefix;
            const itemBelongsToPreviousLayer = parseRules.rules.itemBelongsToPreviousLayer;
            
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                
                if (trimmed.startsWith(framePrefix)) {
                    if (currentFrame) {
                        frames.push(currentFrame);
                    }
                    const frameNum = parseInt(trimmed.replace(framePrefix, '').trim());
                    currentFrame = { frameNum, layers: [], items: [] };
                    currentLayer = null;
                } else if (trimmed.startsWith(layerPrefix) && currentFrame) {
                    const data = parseLayerLine(trimmed, layerPrefix);
                    
                    if (data.id && data.x1 !== undefined && data.y1 !== undefined && data.x2 !== undefined && data.y2 !== undefined) {
                        currentLayer = { id: data.id, x1: data.x1, y1: data.y1, x2: data.x2, y2: data.y2 };
                        currentFrame.layers.push(currentLayer);
                    }
                } else if (trimmed.startsWith(itemPrefix) && currentFrame) {
                    const data = parseLayerLine(trimmed, itemPrefix);
                    
                    if (data.name && data.x1 !== undefined && data.y1 !== undefined && data.x2 !== undefined && data.y2 !== undefined) {
                        const item = { name: data.name, x1: data.x1, y1: data.y1, x2: data.x2, y2: data.y2 };
                        currentFrame.items.push(item);
                    }
                }
            }
            
            if (currentFrame) {
                frames.push(currentFrame);
            }
            
            return frames;
        }

        function renderFrame(frame) {
            clearAll();
            
            let layerIndex = 0;
            for (const layerData of frame.layers) {
                const layer = createLayerBox(layerData.id, layerData.x1, layerData.y1, layerData.x2, layerData.y2, layerIndex);
                layerIndex++;
            }
            
            let layerIdx = 0;
            for (const itemData of frame.items) {
                let baseZ = 0;
                if (layerIdx < layers.length) {
                    baseZ = layers[layerIdx].z;
                }
                createItemBox(itemData.name, itemData.x1, itemData.y1, itemData.x2, itemData.y2, baseZ);
                layerIdx++;
            }
        }

        function showFrame(index) {
            if (index < 0 || index >= parsedFrames.length) return;
            currentFrameIndex = index;
            renderFrame(parsedFrames[index]);
            updateFrameUI();
        }

        function updateFrameUI() {
            const slider = document.getElementById('frame-slider');
            const frameInfo = document.getElementById('frame-info');
            const frameInput = document.getElementById('frame-input');
            slider.max = parsedFrames.length;
            slider.value = currentFrameIndex + 1;
            frameInput.value = currentFrameIndex + 1;
            const playingText = isPlaying ? ' (播放中)' : '';
            frameInfo.textContent = `帧: ${currentFrameIndex + 1} / ${parsedFrames.length}${playingText}`;
            
            const btnPlay = document.getElementById('btn-play');
            btnPlay.textContent = isPlaying ? '⏸' : '▶';
        }

        function play() {
            if (parsedFrames.length <= 1) return;
            isPlaying = true;
            updateFrameUI();
            
            playInterval = setInterval(() => {
                let nextIndex = currentFrameIndex + 1;
                if (nextIndex >= parsedFrames.length) {
                    pause();
                    showFrame(0);
                    return;
                }
                showFrame(nextIndex);
            }, playSpeed);
        }

        function pause() {
            isPlaying = false;
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
            updateFrameUI();
        }

        function togglePlay() {
            if (isPlaying) {
                pause();
            } else {
                play();
            }
        }

        function clearAll() {
            for (const layer of layers) {
                scene.remove(layer.box);
                scene.remove(layer.text);
                scene.remove(layer.edges);
            }
            layers.length = 0;
            
            for (const item of items) {
                scene.remove(item.box);
                scene.remove(item.text);
                scene.remove(item.edges);
            }
            items.length = 0;
        }

        function createLayerBox(id, x1, y1, x2, y2, z) {
            const width = Math.abs(x2 - x1);
            const height = Math.abs(y2 - y1);
            const depth = 0.3;
            
            const centerX = (x1 + x2) / 2;
            const centerY = (y1 + y2) / 2;
            const screenY = -centerY;
            
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x007AFF,
                transparent: true,
                opacity: 0.15
            });
            const box = new THREE.Mesh(geometry, material);
            box.position.set(centerX, screenY, z * 2);
            scene.add(box);
            
            const edgesGeometry = new THREE.EdgesGeometry(geometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ color: 0x007AFF, linewidth: 2 });
            const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
            edges.position.copy(box.position);
            scene.add(edges);
            
            let textMesh = null;
            if (window.textFont) {
                const textSize = Math.min(width, height) * 0.25;
                const textGeometry = new TextGeometry(id, {
                    font: window.textFont,
                    size: textSize,
                    height: 0.1
                });
                textGeometry.computeBoundingBox();
                const textMaterial = new THREE.MeshPhongMaterial({ color: 0x007AFF });
                textMesh = new THREE.Mesh(textGeometry, textMaterial);
                
                const bbox = textGeometry.boundingBox;
                const textWidth = bbox.max.x - bbox.min.x;
                const textHeight = bbox.max.y - bbox.min.y;
                
                textMesh.position.set(centerX - textWidth / 2, screenY - textHeight / 2, z * 2 + depth / 2 + 0.1);
                scene.add(textMesh);
            }
            
            const layerObj = { box, text: textMesh, id, z: z * 2, edges };
            layers.push(layerObj);
            return layerObj;
        }
        
        function createItemBox(name, x1, y1, x2, y2, z) {
            const width = Math.abs(x2 - x1);
            const height = Math.abs(y2 - y1);
            const depth = 0.1;
            
            const centerX = (x1 + x2) / 2;
            const centerY = (y1 + y2) / 2;
            const screenY = -centerY;
            
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0xAF52DE,
                transparent: true,
                opacity: 0.1
            });
            const box = new THREE.Mesh(geometry, material);
            box.position.set(centerX, screenY, z + depth);
            scene.add(box);
            
            const edgesGeometry = new THREE.EdgesGeometry(geometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ color: 0xAF52DE, linewidth: 2 });
            const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
            edges.position.copy(box.position);
            scene.add(edges);
            
            let textMesh = null;
            if (window.textFont) {
                const maxTextWidth = width * 0.8;
                const maxTextHeight = height * 0.5;
                let textSize = Math.min(width, height) * 0.2;
                
                const textGeometry = new TextGeometry(name, {
                    font: window.textFont,
                    size: textSize,
                    height: 0.05
                });
                textGeometry.computeBoundingBox();
                
                let bbox = textGeometry.boundingBox;
                let textWidth = bbox.max.x - bbox.min.x;
                let textHeight = bbox.max.y - bbox.min.y;
                
                while (textWidth > maxTextWidth && textSize > 0.5) {
                    textSize -= 0.1;
                    textGeometry.dispose();
                    const newGeometry = new TextGeometry(name, {
                        font: window.textFont,
                        size: textSize,
                        height: 0.05
                    });
                    newGeometry.computeBoundingBox();
                    bbox = newGeometry.boundingBox;
                    textWidth = bbox.max.x - bbox.min.x;
                    textHeight = bbox.max.y - bbox.min.y;
                }
                
                const textMaterial = new THREE.MeshPhongMaterial({ color: 0xAF52DE });
                textMesh = new THREE.Mesh(textGeometry, textMaterial);
                
                textMesh.position.set(centerX - textWidth / 2, screenY - textHeight / 2, z + depth + 0.05);
                scene.add(textMesh);
            }
            
            items.push({ box, text: textMesh, name, edges });
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(30, 30, 30);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 50, 50);
            scene.add(directionalLight);

            const fontLoader = new FontLoader();
            fontLoader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
                window.textFont = font;
            });

            const axesHelper = new THREE.AxesHelper(100);
            scene.add(axesHelper);
            
            const gridHelper = new THREE.GridHelper(200, 20);
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);

            document.getElementById('btn-config').addEventListener('click', loadConfig);
            document.getElementById('btn-load').addEventListener('click', loadLog);
            document.getElementById('btn-reset').addEventListener('click', resetCamera);
            
            document.getElementById('btn-play').addEventListener('click', togglePlay);
            document.getElementById('btn-prev').addEventListener('click', () => showFrame(currentFrameIndex - 1));
            document.getElementById('btn-next').addEventListener('click', () => showFrame(currentFrameIndex + 1));
            
            document.getElementById('frame-slider').addEventListener('change', function(e) {
                pause();
                showFrame(parseInt(e.target.value) - 1);
            });
            
            document.getElementById('btn-goto').addEventListener('click', function() {
                const input = document.getElementById('frame-input');
                const frameNum = parseInt(input.value);
                if (frameNum >= 1 && frameNum <= parsedFrames.length) {
                    pause();
                    showFrame(frameNum - 1);
                } else {
                    input.value = currentFrameIndex + 1;
                }
            });
            
            document.getElementById('frame-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('btn-goto').click();
                }
            });
            
            document.getElementById('speed-slider').addEventListener('input', function(e) {
                playSpeed = parseInt(e.target.value);
                document.getElementById('speed-value').textContent = playSpeed + 'ms';
                if (isPlaying) {
                    pause();
                    play();
                }
            });

            animate();
        }

        function loadConfig() {
            document.getElementById('config-input').click();
        }

        document.getElementById('config-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    parseRules = JSON.parse(event.target.result);
                    document.getElementById('info').textContent = '规则配置已加载: ' + file.name;
                } catch (error) {
                    document.getElementById('info').textContent = '规则配置解析失败';
                }
            };
            reader.onerror = function() {
                document.getElementById('info').textContent = '读取规则配置文件失败';
            };
            reader.readAsText(file);
        });

        function loadLog() {
            if (!parseRules) {
                document.getElementById('info').textContent = '请先选择规则配置文件';
                return;
            }
            document.getElementById('file-input').click();
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('info').textContent = '加载中...';
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                parsedFrames = parseLogToFrames(text);
                
                if (parsedFrames.length === 0) {
                    document.getElementById('info').textContent = '未解析到有效帧数据';
                    return;
                }
                
                pause();
                showFrame(0);
                document.getElementById('frame-control').classList.add('active');
                document.getElementById('info').textContent = `日志加载成功: ${file.name} (${parsedFrames.length}帧)`;
            };
            reader.onerror = function() {
                document.getElementById('info').textContent = '读取文件失败';
            };
            reader.readAsText(file);
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function resetCamera() {
            camera.position.set(30, 30, 30);
            camera.lookAt(0, 0, 0);
            controls.reset();
        }

        init();
    </script>
</body>
</html>
